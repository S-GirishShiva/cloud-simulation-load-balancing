# Stress test scenario - heavy workload to trigger migrations
scenarioId: "stress_test"
duration: 100
seed: 42
tickInterval: 1.0

infrastructureConfig:
  federationCount: 1
  datacentersPerFederation: 2
  hostsPerDatacenter: 5
  vmsPerHost: 3  # More VMs per host

workloadConfig:
  patternType: "steady"
  seed: 42
  duration: 100
  intensity: 20.0         # 20 cloudlets/second (5x higher!)
  burstMultiplier: 1.0
  frequency: 1.0
  rampUpDuration: 0

policyConfig:
  defaultPolicy: "threshold"
  enableMetrics: true

# Quick Test Scenario - 30 second run for rapid validation
scenarioId: "quick_test"
duration: 30  # 30 seconds
seed: 42
tickInterval: 1.0

infrastructureConfig:
  federationCount: 1
  datacentersPerFederation: 2
  hostsPerDatacenter: 5
  vmsPerHost: 2  # 20 VMs total

workloadConfig:
  patternType: "steady"
  seed: 42
  duration: 30
  intensity: 4.0          # 4 cloudlets/second
  burstMultiplier: 1.0
  frequency: 1.0
  rampUpDuration: 0

policyConfig:
  defaultPolicy: "threshold"
  enableMetrics: true
